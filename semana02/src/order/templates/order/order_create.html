{% extends "core/base.html" %}

{% block title %}Registrar Pedido{% endblock %}

{% block content %}
    <h2>Registrar Nuevo Pedido</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Guardar Pedido</button>
    </form>
    <p><a href="{% url 'order_list' %}">Volver a los Pedidos</a></p>
{% endblock %}
