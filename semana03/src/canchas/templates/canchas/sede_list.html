{% extends 'canchas/base.html' %}

{% block content %}
<h2>Sedes</h2>
<a href="{% url 'sede_create' %}">+ Nueva sede</a>

<table border="1">
    <tr><th>Nombre</th><th>Dirección</th><th>Acciones</th></tr>
    {% for s in sedes %}
    <tr>
        <td>{{ s.nombre }}</td><td>{{ s.direccion }}</td>
        <td>
            <a href="{% url 'sede_update' s.id %}">Editar</a>
            <a href="{% url 'sede_delete' s.id %}">Eliminar</a>
        </td>
    </tr>
    {% empty %}
    <tr><td colspan="3">No hay sedes registradas.</td></tr>
    {% endfor %}
</table>
{% endblock %}
