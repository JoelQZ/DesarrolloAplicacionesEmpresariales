{% extends 'base.html' %}
{% block title %}Clientes{% endblock %}
{% block content %}
<div class="card shadow-sm border-0">
    <div class="card-header bg-info text-white d-flex justify-content-between align-items-center">
        <h4 class="mb-0"><i class="fas fa-user"></i> Clientes</h4>
        <a href="{% url 'cliente_create' %}" class="btn btn-light btn-sm"><i class="fas fa-plus"></i> Nuevo</a>
    </div>
    <div class="card-body">
        <table class="table table-hover align-middle">
            <thead>
                <tr><th>Nombre</th><th>Teléfono</th></tr>
            </thead>
            <tbody>
                {% for cliente in object_list %}
                <tr>
                    <td>{{ cliente.nombre }}</td>
                    <td>{{ cliente.telefono }}</td>
                </tr>
                {% empty %}
                <tr><td colspan="2" class="text-center text-muted">No hay clientes.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
