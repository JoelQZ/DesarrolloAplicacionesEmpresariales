{% extends 'base.html' %}
{% block title %}Receta de pizza{% endblock %}
{% block content %}
<div class="card shadow-sm border-0">
    <div class="card-header bg-danger text-white">
        <h4 class="mb-0"><i class="fas fa-clipboard-list"></i> Receta de pizza</h4>
    </div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="mb-3">
                    <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <div class="text-danger small">{{ field.errors|join:', ' }}</div>
                    {% endif %}
                </div>
            {% endfor %}
            <button type="submit" class="btn btn-danger">
                <i class="fas fa-save"></i> Guardar
            </button>
            <a href="{% url 'pizza_list' %}" class="btn btn-outline-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
